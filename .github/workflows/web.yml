name: Publicar web
on:
  push:
    branches: [main]
  workflow_dispatch:          # a mano o desde fuera (cron-job.org / el bot); el cron de GitHub no es fiable

permissions:
  contents: write             # guardar src/data/videos.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # una ejecución nueva cancela la anterior (si GitHub la deja atascada, no bloquea la web);
                             # no se pierde nada: cada ejecución reconstruye la web entera con los datos más recientes

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                # guarda las dependencias entre ejecuciones
      - run: npm ci                 # instala exactamente las versiones de package-lock.json
      - name: Actualizar vídeos
        run: npm run videos
      - name: Guardar vídeos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/data/videos.json
          git diff --staged --quiet || (git commit -m "Actualizar vídeos" && git pull --rebase && git push)
      - run: npm run build
        env:                        # seguidores de las redes de vídeo (ver cargarSeguidores en src/lib/datos.js)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          TIKTOK_SEGUIDORES: ${{ vars.TIKTOK_SEGUIDORES }}   # variable (Settings → Secrets and variables → Actions → Variables)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
